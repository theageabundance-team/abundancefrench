  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0f0c;--bg2:#0a120d;--card:#0d1a10;--acc:#74c69d;--acc-light:#a8dfc0;--acc-dim:rgba(116,198,157,0.1);--acc-border:rgba(116,198,157,0.28);--text:#f0ece0;--text-dim:#8aaa94;--text-muted:#4a6a54;}
    *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:17px;line-height:1.75;min-height:100vh;opacity:0;animation:fadeIn 0.7s ease forwards;}
    body.page-fade-out{animation:fadeOut 0.35s ease forwards;}
    @keyframes fadeIn{to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;}
    .banner{background:var(--bg2);border-bottom:1px solid var(--acc-border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
    .badge-wrap{background:var(--acc-dim);border:1px solid var(--acc-border);border-radius:3px;padding:6px 14px;display:flex;align-items:center;gap:10px;}
    .badge-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);}
    .badge-sub{font-size:11px;color:var(--text-dim);}
    .back-btn{display:flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;transition:color .2s;}
    .back-btn:hover{color:var(--acc);}
    .hero{text-align:center;padding:60px 24px 44px;position:relative;overflow:hidden;}
    .hero-glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(116,198,157,0.09) 0%,transparent 70%);pointer-events:none;}
    .day-pill{display:inline-block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc-border);border-radius:20px;padding:6px 18px;margin-bottom:20px;opacity:.8;}
    .hero-title{font-family:'Cinzel',serif;font-size:clamp(28px,6vw,50px);font-weight:700;color:var(--acc);line-height:1.15;margin-bottom:8px;}
    .hero-sub{font-size:clamp(15px,2.5vw,18px);color:var(--text-dim);font-style:italic;margin-bottom:24px;}
    .hero-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:0 auto 20px;}
    .hero-date{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);}
    .content-wrap{max-width:680px;margin:0 auto;padding:0 24px 80px;}
    .focus-card{background:var(--card);border:1px solid var(--acc-border);border-top:3px solid var(--acc);border-radius:6px;padding:40px 36px;margin-bottom:20px;animation:slideUp 0.5s ease forwards;opacity:0;}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .card-eyebrow{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);opacity:.6;margin-bottom:10px;}
    .card-theme{font-family:'Cinzel',serif;font-size:24px;font-weight:600;color:var(--acc);margin-bottom:16px;}
    .week-badge{display:inline-block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;background:var(--acc-dim);border:1px solid var(--acc-border);color:var(--acc);border-radius:2px;padding:4px 12px;margin-bottom:20px;}
    .card-divider{height:1px;background:var(--acc-border);margin-bottom:24px;}
    .proverb-box{background:rgba(116,198,157,0.07);border-left:3px solid var(--acc);border-radius:0 4px 4px 0;padding:20px 24px;margin-bottom:20px;font-style:italic;font-size:18px;color:var(--acc-light);line-height:1.7;}
    .card-body-text{font-size:16px;color:var(--text-dim);line-height:1.85;margin-bottom:32px;}
    .done-btn{width:100%;background:transparent;border:1px solid var(--acc-border);color:var(--text-dim);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-radius:3px;padding:16px 24px;cursor:pointer;transition:all .25s;}
    .done-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-dim);}
    .done-btn.done{background:var(--acc-dim);border-color:var(--acc);color:var(--acc);cursor:default;}
    .other-cards-section{max-width:680px;margin:0 auto;padding:0 24px 60px;}
    .other-cards-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;text-align:center;}
    .other-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .other-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:16px 10px;text-align:center;cursor:pointer;text-decoration:none;display:block;transition:all .2s;position:relative;overflow:hidden;}
    .other-card:hover{border-color:rgba(201,168,76,0.3);transform:translateY(-2px);}
    .other-card.is-done{border-color:rgba(80,200,100,0.4);background:rgba(80,200,100,0.06);}
    .other-card-icon{font-size:22px;margin-bottom:6px;}
    .other-card-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);line-height:1.3;}
    .other-card-check{position:absolute;top:6px;right:8px;font-size:11px;color:#5cc878;}
    .celeb-overlay{display:none;position:fixed;inset:0;background:rgba(5,3,10,.88);z-index:600;align-items:center;justify-content:center;padding:24px;}
    .celeb-overlay.visible{display:flex;}
    .celeb-modal{background:#1a1020;border:1px solid #c9a84c;border-top:3px solid #c9a84c;border-radius:6px;padding:48px 36px;text-align:center;max-width:440px;width:100%;animation:revealUp .4s ease;}
    @keyframes revealUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .celeb-stars{font-size:14px;color:#c9a84c;letter-spacing:.3em;margin-bottom:16px;}
    .celeb-emoji{font-size:52px;margin-bottom:16px;}
    .celeb-title{font-family:'Cinzel',serif;font-size:22px;color:#c9a84c;font-weight:700;margin-bottom:10px;}
    .celeb-text{font-size:15px;color:#b8a898;line-height:1.75;margin-bottom:20px;}
    .celeb-verse{font-style:italic;font-size:13px;color:rgba(201,168,76,.6);margin-bottom:28px;}
    .celeb-btn{background:linear-gradient(135deg,#8a6020,#c9a84c);color:#0a0508;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;border:none;border-radius:3px;padding:15px 32px;cursor:pointer;width:100%;}
    .nav-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
    .nav-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:16px 12px;text-align:center;cursor:pointer;text-decoration:none;transition:all .2s;display:block;}
    .nav-card:hover{border-color:var(--acc-border);}
    .nav-card-icon{font-size:22px;margin-bottom:6px;}
    .nav-card-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);line-height:1.3;}
    @media(max-width:600px){.focus-card{padding:28px 20px;}}
  </style>

<body>
  <header class="banner">
    <a href="index.html" class="back-btn" onclick="navigateTo(event,'index.html')">← Retour à l'Accueil</a>
    <div class="badge-wrap"><span style="font-size:18px;">👑</span><div><div class="badge-title">Pratique du Jour</div><div class="badge-sub">Sagesse de Salomon</div></div></div>
  </header>
  <section class="hero">
    <div class="hero-glow"></div>
    <div class="day-pill" id="dayPill"></div>
    <h1 class="hero-title">Sagesse de Salomon</h1>
    <p class="hero-sub">La sagesse antique pour votre chemin aujourd'hui</p>
    <div class="hero-divider"></div>
    <p class="hero-date" id="heroDate"></p>
  </section>
  <div class="content-wrap">
    <div class="focus-card" style="animation-delay:0.1s">
      <div class="card-eyebrow">👑 Enseignement du Jour</div>
      <div class="card-theme" id="focusTheme"></div>
      <div class="week-badge" id="weekBadge"></div>
      <div class="card-divider"></div>
      <div class="proverb-box" id="proverbText"></div>
      <div class="card-body-text" id="focusDesc"></div>
      <button class="done-btn" id="doneBtn" onclick="markDone()">✦ Appliquer Cette Sagesse</button>
    </div>

  </div>
  <script src="supabase-client.js"></script>
  <script>
    const SOLOMONS=[{0:{theme:'Repos & Confiance',proverb:'"Mieux vaut une main pleine avec le repos, que deux mains pleines avec le travail et la poursuite du vent."',desc:'Le repos n\'est pas une récompense pour celui qui a terminé — c\'est le sceau de la confiance. L\'homme sage se repose parce qu\'il sait qui tient demain.'},1:{theme:'Prospérité',proverb:'"Des mains négligentes appauvrissent, mais des mains diligentes enrichissent."',desc:'La prospérité ne visite pas ceux qui attendent — elle poursuit ceux qui travaillent avec ordre. Votre diligence aujourd\'hui est la récolte de demain.'},2:{theme:'Mentalité',proverb:'"Garde ton cœur plus que toute autre chose, car de lui viennent les sources de la vie."',desc:'Si vous ne gouvernez pas ce que vous ressentez, le monde vous gouvernera. Le cœur est votre centre de commandement — protégez-le comme un roi garde son trône.'},3:{theme:'Connection',proverb:'"Les projets échouent faute de conseil, mais ils réussissent quand les conseillers sont nombreux."',desc:'Apprenez à écouter avant de décider. Se précipiter devant la sagesse c\'est se précipiter vers le regret. Ralentissez et écoutez les conseils autour de vous.'},4:{theme:'Abondance',proverb:'"Tel donne avec largesse et se trouve enrichi, tel autre épargne à l\'excès et se trouve appauvri."',desc:'La loi est inviolable : le flux ne continue que s\'il y a un déversoir. Donnez généreusement aujourd\'hui et regardez le canal s\'élargir.'},5:{theme:'Protection',proverb:'"L\'homme prudent voit le danger et se cache, mais les simples avancent et en souffrent."',desc:'La sagesse n\'est pas de la paranoïa — c\'est de la conscience. N\'ignorez pas les signaux d\'avertissement placés sur votre chemin aujourd\'hui.'},6:{theme:'Vision',proverb:'"Les projets bien préparés aboutissent certainement, et celui qui se hâte vers la richesse manquera son but."',desc:'La vision sans stratégie n\'est que de l\'enthousiasme. Un plan bien fait est déjà à moitié exécuté. Prenez le temps de tracer votre route.'}},{0:{theme:'Repos & Valeur',proverb:'"Mieux vaut un morceau de pain sec avec la tranquillité, qu\'une maison pleine de festins avec des querelles."',desc:'Chérissez la paix de votre foyer aujourd\'hui au-dessus de tout gain extérieur. Une table silencieuse dans une maison d\'amour vaut plus que l\'abondance dans une maison de guerre.'},1:{theme:'Prospérité',proverb:'"Honore l\'Éternel avec tes richesses et avec les prémices de tous tes revenus."',desc:'Quand vous mettez la Source à la bonne place, le canal ne se tarit jamais. Honorez d\'abord, et regardez le débordement suivre.'},2:{theme:'Mentalité',proverb:'"Une réponse douce calme la fureur, mais une parole blessante excite la colère."',desc:'Votre autorité aujourd\'hui sera mesurée par votre capacité à rester calme sous pression. Le sage gouvernant gouverne par la paix, pas par la force.'},3:{theme:'Connection',proverb:'"La crainte de l\'Éternel est le commencement de la sagesse."',desc:'Reconnaître que vous ne savez pas tout est le premier pas vers l\'enseignement de Dieu sur le chemin le plus rapide. L\'humilité ouvre la porte par laquelle marche la sagesse.'},4:{theme:'Abondance',proverb:'"Celui qui est généreux sera rassasié, et celui qui arrose sera lui-même arrosé."',desc:'La vraie richesse commence dans un esprit qui se sent déjà pourvu. Celui qui donne depuis la plénitude reçoit toujours plus.'},5:{theme:'Protection',proverb:'"Celui qui marche avec intégrité marchera avec assurance, mais celui qui prend des voies tortueuses sera découvert."',desc:'La vérité est votre armure la plus efficace — elle ne coûte rien et protège tout. Marchez dans l\'intégrité aujourd\'hui sans exception.'},6:{theme:'Vision',proverb:'"Il y a certainement un avenir pour toi, et ton espérance ne sera pas anéantie."',desc:'Gardez les yeux sur l\'horizon. Le présent n\'est qu\'une étape, pas une destination. Ce que vous espérez est déjà en préparation.'}},{0:{theme:'Repos & Saisons',proverb:'"Il y a un temps pour tout, un moment pour chaque chose sous les cieux."',desc:'Aujourd\'hui, le but est de profiter. La saison des semailles est passée — le temps du repos est venu. Entrez-y sans culpabilité.'},1:{theme:'Prospérité',proverb:'"Répartis tes biens entre sept ou même huit entreprises, car tu ne sais pas quel malheur pourra survenir sur la terre."',desc:'Multipliez vos sources. Ne placez pas tout votre espoir dans un seul canal. La diversification est la sagesse en mouvement.'},2:{theme:'Mentalité',proverb:'"L\'orgueil précède la ruine, et l\'esprit arrogant précède la chute."',desc:'Gardez votre cœur enseignable. L\'humilité est le tapis rouge de l\'honneur. Plus haut vous êtes appelé, plus bas vous devez être prêt à vous incliner.'},3:{theme:'Connection',proverb:'"Comme le fer aiguise le fer, ainsi un homme en aiguise un autre."',desc:'Choisissez soigneusement qui s\'assoit à votre table aujourd\'hui. Vos connexions définissent votre vitesse. Les bonnes personnes aiguisent votre avantage.'},4:{theme:'Abondance',proverb:'"La bénédiction de l\'Éternel enrichit, et il n\'y ajoute aucune peine."',desc:'Si votre gain apporte de l\'angoisse, examinez la source. La richesse du Royaume arrive avec la paix, non avec l\'anxiété. Ajustez le canal.'},5:{theme:'Protection',proverb:'"Le riche domine sur les pauvres, et l\'emprunteur est esclave du prêteur."',desc:'Fuyez les chaînes de la dette. La liberté est le sol de la créativité. Chaque obligation que vous éliminez crée de l\'espace pour quelque chose de plus grand.'},6:{theme:'Vision',proverb:'"Par la sagesse on bâtit une maison, par l\'intelligence on l\'affermit, par la connaissance les chambres se remplissent de biens précieux et agréables."',desc:'La connaissance est l\'immobilier le plus précieux que vous puissiez acquérir. Investissez dans l\'apprentissage et regardez vos chambres intérieures se remplir de trésors.'}},{0:{theme:'Repos & Joie',proverb:'"J\'ai donc reconnu qu\'il n\'y a rien de mieux pour l\'homme que de se réjouir de ses œuvres, car c\'est là sa part."',desc:'Célébrez ce que vous avez déjà conquis. Le repos et la joie ne sont pas de la paresse — ils sont le fruit d\'une vie bien plantée.'},1:{theme:'Prospérité',proverb:'"L\'homme de bien laisse un héritage à ses petits-enfants."',desc:'Ne travaillez pas seulement pour payer les factures. Travaillez pour construire un empire qui vous survivra. Votre héritage est votre plus grand investissement.'},2:{theme:'Mentalité',proverb:'"Car telles sont ses pensées en lui-même, tel est-il."',desc:'Votre réalité physique n\'est qu\'un reflet de votre image intérieure. Changez le miroir aujourd\'hui — et regardez le monde extérieur commencer à s\'aligner.'},3:{theme:'Connection',proverb:'"Un bon renom vaut mieux que de grandes richesses, et la bienveillance vaut mieux que l\'argent et l\'or."',desc:'Votre réputation ouvre des portes que l\'argent ne peut pas acheter. Gardez votre parole aujourd\'hui comme la monnaie la plus précieuse que vous portez.'},4:{theme:'Abondance',proverb:'"Celui qui sème l\'injustice récolte le malheur, et la verge de sa fureur sera brisée."',desc:'L\'univers est un écho — ce que vous envoyez revient amplifié. Semez l\'intégrité, la générosité et l\'amour. La récolte correspond à la graine.'},5:{theme:'Protection',proverb:'"Le nom de l\'Éternel est une tour forte ; le juste s\'y réfugie et se trouve en sécurité."',desc:'Quand le monde tremble, ne faites pas confiance à votre compte bancaire — faites confiance au Rocher. Courez vers le Nom qui ne change jamais.'},6:{theme:'Vision',proverb:'"Recommande à l\'Éternel tout ce que tu fais, et tes projets réussiront."',desc:'Soulevez le poids de vos épaules et placez-le sur l\'autel. Quand Dieu est le co-auteur de vos plans, le succès n\'est pas une possibilité — c\'est une promesse.'}}];
    const WEEK_NAMES=['Semaine 1 — Récolte & Diligence','Semaine 2 — Caractère & Flux','Semaine 3 — Maîtrise & Influence','Semaine 4 — Héritage & Plénitude'];
    const DOW=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    function getContent(){let s=localStorage.getItem('abundance_start_date');if(!s){s=_sbToday();localStorage.setItem('abundance_start_date',s);}const start=new Date(s+'T00:00:00');const today=new Date();today.setHours(0,0,0,0);const days=Math.floor((today-start)/86400000);const wi=Math.floor(days/7)%4;const dow=today.getDay();return{data:SOLOMONS[wi][dow],wi,dow};}
    function init(){const{data,wi,dow}=getContent();const today=new Date();document.getElementById('dayPill').textContent=DOW[dow];document.getElementById('heroDate').textContent=today.toLocaleDateString('fr-FR',{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('focusTheme').textContent=data.theme;document.getElementById('weekBadge').textContent=WEEK_NAMES[wi];document.getElementById('proverbText').textContent=data.proverb;document.getElementById('focusDesc').textContent=data.desc;const ts=_sbToday();if(localStorage.getItem('solomons_wisdom_done')===ts){const btn=document.getElementById('doneBtn');btn.textContent='✓ Sagesse Appliquée';btn.classList.add('done');btn.disabled=true;}}
    function markDone(){const btn=document.getElementById('doneBtn');btn.textContent='✓ Sagesse Appliquée';btn.classList.add('done');btn.disabled=true;localStorage.setItem('solomons_wisdom_done',_sbToday());saveDailyProgress('solomons_wisdom');spawnCelebParticles();setTimeout(()=>{ if(allDoneToday()) showCelebration(); else renderOtherCards('solomons_wisdom_done'); },600);}
    window.addEventListener('pageshow',function(ev){if(ev.persisted){document.body.classList.remove('page-fade-out');document.body.style.opacity='';}}); function navigateTo(e,url){e.preventDefault();document.body.classList.add('page-fade-out');setTimeout(()=>window.location.href=url,350);}
    const ALL_CARDS=[{key:'daily_focus_done',emoji:'🎯',label:'Focus Quotidien',url:'player-daily-focus.html'},{key:'divine_truth_done',emoji:'✝️',label:'Vérité Divine',url:'player-divine-truth.html'},{key:'solomons_wisdom_done',emoji:'👑',label:'Sagesse de Salomon',url:'player-solomons-wisdom.html'},{key:'daily_decree_done',emoji:'📜',label:'Décret Quotidien',url:'player-daily-decree.html'}];
    const todayStr=_sbToday();
    function isDoneToday(k){return localStorage.getItem(k)===todayStr;}
    function allDoneToday(){return ALL_CARDS.every(c=>isDoneToday(c.key));}
    function renderOtherCards(currentKey){const others=ALL_CARDS.filter(c=>c.key!==currentKey);const s=document.createElement('div');s.className='other-cards-section';s.innerHTML=`<div class="other-cards-title">Pratique du Jour</div><div class="other-cards-grid">${others.map(c=>`<a class="other-card${isDoneToday(c.key)?' is-done':''}" href="${c.url}" onclick="navigateTo(event,'${c.url}')">${isDoneToday(c.key)?'<span class="other-card-check">✓</span>':''}<div class="other-card-icon">${c.emoji}</div><div class="other-card-label">${c.label}</div></a>`).join('')}</div>`;document.body.appendChild(s);}
    function showCelebration(){const m=document.createElement('div');m.className='celeb-overlay';m.innerHTML=`<div class="celeb-modal"><div class="celeb-stars">✦ ✦ ✦</div><div class="celeb-emoji">🙌</div><div class="celeb-title">Tout Accompli Aujourd'hui !</div><div class="celeb-text">Vous avez marché en plein alignement aujourd'hui. Votre fidélité a été enregistrée au Ciel.</div><div class="celeb-verse">« Bien, bon et fidèle serviteur. » — Matthieu 25:23</div><button class="celeb-btn" onclick="navigateTo(event,'index.html')">Retour à l'Accueil</button></div>`;document.body.appendChild(m);setTimeout(()=>m.classList.add('visible'),50);spawnCelebParticles();}
    function spawnCelebParticles(){const colors=['#c9a84c','#e8c96d','#fff8e7','#ffffff'];for(let i=0;i<50;i++){const p=document.createElement('div');p.className='particle';const size=4+Math.random()*8,angle=Math.random()*Math.PI*2,dist=100+Math.random()*200;p.style.cssText=`width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};position:fixed;left:${window.innerWidth/2}px;top:${window.innerHeight/2}px;border-radius:50%;pointer-events:none;z-index:700;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist-80}px;animation:particleFly ${0.9+Math.random()*0.7}s ease-out ${Math.random()*0.2}s forwards;`;document.body.appendChild(p);setTimeout(()=>p.remove(),1800);}}
    init();
    renderOtherCards('solomons_wisdom_done');
  </script>
