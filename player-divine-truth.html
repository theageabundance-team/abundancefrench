  <style>
    :root{--bg:#0a0a0f;--bg2:#0a0f18;--card:#0d1520;--acc:#5b9fd4;--acc-light:#8dc4e8;--acc-dim:rgba(91,159,212,0.1);--acc-border:rgba(91,159,212,0.28);--text:#f0ece0;--text-dim:#8a9aaa;--text-muted:#4a5a6a;}
    *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:17px;line-height:1.75;min-height:100vh;opacity:0;animation:fadeIn 0.7s ease forwards;}
    body.page-fade-out{animation:fadeOut 0.35s ease forwards;}
    @keyframes fadeIn{to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;}
    .banner{background:var(--bg2);border-bottom:1px solid var(--acc-border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
    .badge-wrap{background:var(--acc-dim);border:1px solid var(--acc-border);border-radius:3px;padding:6px 14px;display:flex;align-items:center;gap:10px;}
    .badge-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);}
    .badge-sub{font-size:11px;color:var(--text-dim);}
    .back-btn{display:flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;transition:color .2s;}
    .back-btn:hover{color:var(--acc);}
    .hero{text-align:center;padding:60px 24px 44px;position:relative;overflow:hidden;}
    .hero-glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(91,159,212,0.1) 0%,transparent 70%);pointer-events:none;}
    .day-pill{display:inline-block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc-border);border-radius:20px;padding:6px 18px;margin-bottom:20px;opacity:.8;}
    .hero-title{font-family:'Cinzel',serif;font-size:clamp(28px,6vw,50px);font-weight:700;color:var(--acc);line-height:1.15;margin-bottom:8px;}
    .hero-sub{font-size:clamp(15px,2.5vw,18px);color:var(--text-dim);font-style:italic;margin-bottom:24px;}
    .hero-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:0 auto 20px;}
    .hero-date{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);}
    .content-wrap{max-width:680px;margin:0 auto;padding:0 24px 80px;}
    .focus-card{background:var(--card);border:1px solid var(--acc-border);border-top:3px solid var(--acc);border-radius:6px;padding:40px 36px;margin-bottom:20px;animation:slideUp 0.5s ease forwards;opacity:0;}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .card-eyebrow{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);opacity:.6;margin-bottom:10px;}
    .card-theme{font-family:'Cinzel',serif;font-size:24px;font-weight:600;color:var(--acc);margin-bottom:16px;}
    .week-badge{display:inline-block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;background:var(--acc-dim);border:1px solid var(--acc-border);color:var(--acc);border-radius:2px;padding:4px 12px;margin-bottom:20px;}
    .card-divider{height:1px;background:var(--acc-border);margin-bottom:24px;}
    .verse-box{background:rgba(91,159,212,0.07);border-left:3px solid var(--acc);border-radius:0 4px 4px 0;padding:20px 24px;margin-bottom:8px;font-style:italic;font-size:18px;color:var(--acc-light);line-height:1.7;}
    .verse-ref{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);opacity:.7;margin-bottom:24px;padding-left:4px;}
    .card-body-text{font-size:16px;color:var(--text-dim);line-height:1.85;margin-bottom:32px;}
    .done-btn{width:100%;background:transparent;border:1px solid var(--acc-border);color:var(--text-dim);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-radius:3px;padding:16px 24px;cursor:pointer;transition:all .25s;}
    .done-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-dim);}
    .done-btn.done{background:var(--acc-dim);border-color:var(--acc);color:var(--acc);cursor:default;}
    .other-cards-section{max-width:680px;margin:0 auto;padding:0 24px 60px;}
    .other-cards-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;text-align:center;}
    .other-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .other-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:16px 10px;text-align:center;cursor:pointer;text-decoration:none;display:block;transition:all .2s;position:relative;overflow:hidden;}
    .other-card:hover{border-color:rgba(201,168,76,0.3);transform:translateY(-2px);}
    .other-card.is-done{border-color:rgba(80,200,100,0.4);background:rgba(80,200,100,0.06);}
    .other-card-icon{font-size:22px;margin-bottom:6px;}
    .other-card-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);line-height:1.3;}
    .other-card-check{position:absolute;top:6px;right:8px;font-size:11px;color:#5cc878;}
    .celeb-overlay{display:none;position:fixed;inset:0;background:rgba(5,3,10,.88);z-index:600;align-items:center;justify-content:center;padding:24px;}
    .celeb-overlay.visible{display:flex;}
    .celeb-modal{background:#1a1020;border:1px solid #c9a84c;border-top:3px solid #c9a84c;border-radius:6px;padding:48px 36px;text-align:center;max-width:440px;width:100%;animation:revealUp .4s ease;}
    @keyframes revealUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .celeb-stars{font-size:14px;color:#c9a84c;letter-spacing:.3em;margin-bottom:16px;}
    .celeb-emoji{font-size:52px;margin-bottom:16px;}
    .celeb-title{font-family:'Cinzel',serif;font-size:22px;color:#c9a84c;font-weight:700;margin-bottom:10px;}
    .celeb-text{font-size:15px;color:#b8a898;line-height:1.75;margin-bottom:20px;}
    .celeb-verse{font-style:italic;font-size:13px;color:rgba(201,168,76,.6);margin-bottom:28px;}
    .celeb-btn{background:linear-gradient(135deg,#8a6020,#c9a84c);color:#0a0508;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;border:none;border-radius:3px;padding:15px 32px;cursor:pointer;width:100%;}
    @keyframes particleFly{to{transform:translate(var(--tx),var(--ty));opacity:0;}}
    @media(max-width:600px){.focus-card{padding:28px 20px;}}
  </style>

  <script>
    const DIVINE_TRUTH=[{0:{theme:'Repos & Confiance',verse:'"Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos."',ref:'Matthieu 11:28',desc:'Aujourd\'hui est un jour pour déposer chaque fardeau à Ses pieds. Le repos n\'est pas une faiblesse — c\'est la confiance rendue visible.'},1:{theme:'Prospérité',verse:'"Souviens-toi de l\'Éternel, ton Dieu, car c\'est lui qui te donne la force de t\'enrichir."',ref:'Deutéronome 8:18',desc:'Votre capacité à générer l\'abondance n\'est pas votre seul talent — c\'est un don divin. Reconnaissez la Source aujourd\'hui.'},2:{theme:'Mentalité',verse:'"Car ce n\'est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d\'amour et de sagesse."',ref:'2 Timothée 1:7',desc:'Chaque pensée anxieuse aujourd\'hui n\'a aucune origine divine. Vous étiez conçu pour la puissance, pas la paralysie.'},3:{theme:'Connection',verse:'"Arrêtez, et sachez que je suis Dieu !"',ref:'Psaume 46:10',desc:'Dans le silence, Dieu ne crie pas — Il murmure. Aujourd\'hui, soyez suffisamment silencieux pour entendre.'},4:{theme:'Abondance',verse:'"L\'Éternel est mon berger : je ne manquerai de rien."',ref:'Psaume 23:1',desc:'Le manque n\'est pas votre héritage. Vous avez un Berger qui ne dort jamais et ne manque jamais de provision.'},5:{theme:'Protection',verse:'"Celui qui demeure sous l\'abri du Très-Haut repose à l\'ombre du Tout-Puissant."',ref:'Psaume 91:1',desc:'Vous n\'êtes pas exposé. Vous êtes couvert. Marchez aujourd\'hui avec la confiance de quelqu\'un sous protection divine.'},6:{theme:'Vision',verse:'"Écris la vision, grave-la sur des tables, afin qu\'on la lise couramment."',ref:'Habacuc 2:2',desc:'Une vision écrite est une vision activée. Ce que vous pouvez articuler clairement, Dieu peut l\'accomplir précisément.'}},{0:{theme:'Repos & Présence',verse:'"Ma présence marchera avec toi, et je te donnerai le repos."',ref:'Exode 33:14',desc:'Vous ne vous reposez jamais seul. Sa présence vous accompagne dans chaque silence, chaque tranquillité.'},1:{theme:'Prospérité',verse:'"La bénédiction de l\'Éternel enrichit, et il n\'y ajoute aucune peine."',ref:'Proverbes 10:22',desc:'La prospérité divine ne vient pas avec l\'anxiété ou la culpabilité. Si votre abondance apporte du stress, vérifiez la source.'},2:{theme:'Mentalité',verse:'"Ne vous conformez pas au siècle présent, mais soyez transformés par le renouvellement de l\'intelligence."',ref:'Romains 12:2',desc:'Votre esprit est un champ de bataille et un jardin. Ce que vous y laissez pousser détermine ce qui se manifeste à l\'extérieur.'},3:{theme:'Connection',verse:'"Si quelqu\'un d\'entre vous manque de sagesse, qu\'il la demande à Dieu, qui donne à tous généreusement et sans faire de reproche."',ref:'Jacques 1:5',desc:'Vous n\'avez pas besoin de tout comprendre. Vous avez besoin de demander à Celui qui sait déjà tout.'},4:{theme:'Abondance',verse:'"Mon Dieu pourvoira à tous vos besoins selon sa richesse, avec gloire, en Jésus-Christ."',ref:'Philippiens 4:19',desc:'Vos besoins ne sont ni trop petits ni trop grands pour Lui. Chacun d\'eux est déjà couvert dans Son économie.'},5:{theme:'Protection',verse:'"Aucune arme forgée contre toi ne réussira, et tu condamneras toute langue qui s\'élèvera en jugement contre toi."',ref:'Ésaïe 54:17',desc:'Vous n\'êtes pas sans défense. Chaque attaque sur votre but, votre paix et votre prospérité a déjà été désamorcée.'},6:{theme:'Vision',verse:'"Quand il n\'y a pas de vision, le peuple est sans frein ; heureux celui qui observe la loi !"',ref:'Proverbes 29:18',desc:'La vision n\'est pas un luxe — c\'est une nécessité. Sans elle, la vie dérive. Avec elle, tout s\'aligne.'}},{0:{theme:'Repos & Sécurité',verse:'"Je me couche et je m\'endors en paix, car toi seul, Éternel, tu me fais habiter en sécurité."',ref:'Psaume 4:8',desc:'Vous pouvez fermer les yeux ce soir avec une certitude absolue. Vous êtes gardé par Celui qui ne dort jamais.'},1:{theme:'Prospérité',verse:'"Demandez, et l\'on vous donnera ; cherchez, et vous trouverez ; frappez, et l\'on vous ouvrira."',ref:'Matthieu 7:7',desc:'La porte de l\'abondance n\'est pas verrouillée contre vous — elle répond à la demande, à la recherche et aux coups. Commencez aujourd\'hui.'},2:{theme:'Mentalité',verse:'"Je puis tout par celui qui me fortifie."',ref:'Philippiens 4:13',desc:'Vos limitations ne sont pas permanentes — elles sont temporaires sans Lui. Chaque "je ne peux pas" devient "je peux par Christ."'},3:{theme:'Connection',verse:'"Mes brebis entendent ma voix ; je les connais, et elles me suivent."',ref:'Jean 10:27',desc:'Vous êtes connu et reconnu par le Berger. Sa voix parle toujours — vous êtes toujours capable de l\'entendre.'},4:{theme:'Abondance',verse:'"Je suis venu afin que les brebis aient la vie, et qu\'elles l\'aient en abondance."',ref:'Jean 10:10',desc:'La plénitude — pas la survie, pas tout juste assez — c\'est ce qu\'Il est venu donner. Recevez la pleine mesure aujourd\'hui.'},5:{theme:'Protection',verse:'"L\'Éternel te gardera de tout mal, il gardera ton âme."',ref:'Psaume 121:7',desc:'Rien de ce qui vous atteint aujourd\'hui n\'a échappé à Sa conscience. Vous êtes entièrement surveillé.'},6:{theme:'Vision',verse:'"Car je connais les projets que j\'ai formés sur vous, dit l\'Éternel, projets de paix et non de malheur, afin de vous donner un avenir et de l\'espérance."',ref:'Jérémie 29:11',desc:'Votre avenir n\'est pas incertain du point de vue du Ciel. Dieu voit déjà la fin depuis le début — et c\'est bon.'}},{0:{theme:'Repos & Confiance en Soi',verse:'"C\'est dans la tranquillité et la confiance que sera votre force."',ref:'Ésaïe 30:15',desc:'S\'efforcer n\'est pas votre source de force. La confiance tranquille en Dieu l\'est. Aujourd\'hui, revenez au silence et renouvelez-vous.'},1:{theme:'Prospérité',verse:'"Honore l\'Éternel avec tes richesses, et avec les prémices de tous tes revenus ; alors tes greniers seront remplis d\'abondance."',ref:'Proverbes 3:9-10',desc:'L\'honneur précède le débordement. Quand la Source est reconnue en premier, les canaux ne se tarissent jamais.'},2:{theme:'Mentalité',verse:'"Les armes de notre combat ne sont pas charnelles ; mais elles sont puissantes, par la vertu de Dieu, pour renverser des forteresses."',ref:'2 Corinthiens 10:4',desc:'Les batailles mentales que vous affrontez sont réelles — mais l\'arsenal divin qui vous a été donné pour les remporter l\'est aussi.'},3:{theme:'Connection',verse:'"Invoque-moi, et je te répondrai ; je t\'annoncerai de grandes choses, des choses cachées, que tu ne connais pas."',ref:'Jérémie 33:3',desc:'Dieu n\'est pas silencieux. Il attend votre appel. La réponse contient des choses que votre esprit n\'a pas encore imaginées.'},4:{theme:'Abondance',verse:'"À celui qui peut faire, par la puissance qui agit en nous, infiniment au-delà de tout ce que nous demandons ou pensons."',ref:'Éphésiens 3:20',desc:'Votre plus grande prière est encore plus petite que ce dont Dieu est capable. Osez demander davantage aujourd\'hui.'},5:{theme:'Protection',verse:'"Que mille tombent à ton côté, et dix mille à ta droite, cela ne t\'atteindra pas."',ref:'Psaume 91:7',desc:'Vous n\'êtes pas une statistique. Vous êtes couvert par alliance. Ce qui entoure les autres ne vous touchera pas.'},6:{theme:'Vision',verse:'"Or la foi, c\'est la ferme assurance des choses qu\'on espère, la démonstration de celles qu\'on ne voit pas."',ref:'Hébreux 11:1',desc:'La foi n\'est pas prétendre — c\'est voir avec des yeux spirituels ce qui n\'est pas encore arrivé dans le physique. Continuez à voir.'}}];
    const WEEK_NAMES=['Semaine 1 — Alignement & Fondations','Semaine 2 — Autorité & Croissance','Semaine 3 — Percée & Expansion','Semaine 4 — Maîtrise & Victoire'];
    const DOW=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    function getContent(){let s=localStorage.getItem('abundance_start_date');if(!s){s=_sbToday();localStorage.setItem('abundance_start_date',s);}const start=new Date(s+'T00:00:00');const today=new Date();today.setHours(0,0,0,0);const days=Math.floor((today-start)/86400000);const wi=Math.floor(days/7)%4;const dow=today.getDay();return{data:DIVINE_TRUTH[wi][dow],wi,dow};}
    function init(){const{data,wi,dow}=getContent();const today=new Date();document.getElementById('dayPill').textContent=DOW[dow];document.getElementById('heroDate').textContent=today.toLocaleDateString('fr-FR',{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('focusTheme').textContent=data.theme;document.getElementById('weekBadge').textContent=WEEK_NAMES[wi];document.getElementById('verseText').textContent=data.verse;document.getElementById('verseRef').textContent=data.ref;document.getElementById('focusDesc').textContent=data.desc;const ts=_sbToday();if(localStorage.getItem('divine_truth_done')===ts){const btn=document.getElementById('doneBtn');btn.textContent='✓ Vérité Reçue';btn.classList.add('done');btn.disabled=true;}}
    function markDone(){const btn=document.getElementById('doneBtn');btn.textContent='✓ Vérité Reçue';btn.classList.add('done');btn.disabled=true;localStorage.setItem('divine_truth_done',_sbToday());saveDailyProgress('divine_truth');spawnParticles();setTimeout(()=>{ if(allDoneToday()) showCelebration(); else renderOtherCards('divine_truth_done'); },600);}
    function spawnParticles(){const colors=['#5b9fd4','#8dc4e8','#f0ece0','#c9a84c'];for(let i=0;i<30;i++){const p=document.createElement('div');p.className='particle';const size=4+Math.random()*7,angle=Math.random()*Math.PI*2,dist=80+Math.random()*150;p.style.cssText=`width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};position:fixed;left:${window.innerWidth/2}px;top:${window.innerHeight/2}px;border-radius:50%;pointer-events:none;z-index:700;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist-80}px;animation:particleFly ${0.9+Math.random()*0.7}s ease-out ${Math.random()*0.2}s forwards;`;document.body.appendChild(p);setTimeout(()=>p.remove(),1800);}}
    window.addEventListener('pageshow',function(ev){if(ev.persisted){document.body.classList.remove('page-fade-out');document.body.style.opacity='';}}); function navigateTo(e,url){e.preventDefault();document.body.classList.add('page-fade-out');setTimeout(()=>window.location.href=url,350);}
    const ALL_CARDS=[{key:'daily_focus_done',emoji:'🎯',label:'Focus Quotidien',url:'player-daily-focus.html'},{key:'divine_truth_done',emoji:'✝️',label:'Vérité Divine',url:'player-divine-truth.html'},{key:'solomons_wisdom_done',emoji:'👑',label:'Sagesse de Salomon',url:'player-solomons-wisdom.html'},{key:'daily_decree_done',emoji:'📜',label:'Décret Quotidien',url:'player-daily-decree.html'}];
    const todayStr=_sbToday();
    function isDoneToday(k){return localStorage.getItem(k)===todayStr;}
    function allDoneToday(){return ALL_CARDS.every(c=>isDoneToday(c.key));}
    function renderOtherCards(currentKey){const others=ALL_CARDS.filter(c=>c.key!==currentKey);const s=document.createElement('div');s.className='other-cards-section';s.innerHTML=`<div class="other-cards-title">Pratique du Jour</div><div class="other-cards-grid">${others.map(c=>`<a class="other-card${isDoneToday(c.key)?' is-done':''}" href="${c.url}" onclick="navigateTo(event,'${c.url}')">${isDoneToday(c.key)?'<span class="other-card-check">✓</span>':''}<div class="other-card-icon">${c.emoji}</div><div class="other-card-label">${c.label}</div></a>`).join('')}</div>`;document.body.appendChild(s);}
    function showCelebration(){const m=document.createElement('div');m.className='celeb-overlay';m.innerHTML=`<div class="celeb-modal"><div class="celeb-stars">✦ ✦ ✦</div><div class="celeb-emoji">🙌</div><div class="celeb-title">Tout Accompli Aujourd'hui !</div><div class="celeb-text">Vous avez marché en plein alignement aujourd'hui. Votre fidélité a été enregistrée au Ciel.</div><div class="celeb-verse">« Bien, bon et fidèle serviteur. » — Matthieu 25:23</div><button class="celeb-btn" onclick="navigateTo(event,'index.html')">Retour à l'Accueil</button></div>`;document.body.appendChild(m);setTimeout(()=>m.classList.add('visible'),50);spawnCelebParticles();}
    function spawnCelebParticles(){const colors=['#c9a84c','#e8c96d','#fff8e7','#ffffff'];for(let i=0;i<50;i++){const p=document.createElement('div');p.className='particle';const size=4+Math.random()*8,angle=Math.random()*Math.PI*2,dist=100+Math.random()*200;p.style.cssText=`width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};position:fixed;left:${window.innerWidth/2}px;top:${window.innerHeight/2}px;border-radius:50%;pointer-events:none;z-index:700;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist-80}px;animation:particleFly ${0.9+Math.random()*0.7}s ease-out ${Math.random()*0.2}s forwards;`;document.body.appendChild(p);setTimeout(()=>p.remove(),1800);}}
    init();
    renderOtherCards('divine_truth_done');
  </script>
</body>
</html>
